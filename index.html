<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Alcancía del Amor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Quicksand',sans-serif;background:linear-gradient(145deg,#fde8e8 0%,#fbc4c4 100%);min-height:100vh;padding:30px 20px;color:#3a1a1a;}
    .container{max-width:1300px;margin:0 auto;background:rgba(255,245,245,0.82);backdrop-filter:blur(8px);border-radius:60px 60px 40px 40px;box-shadow:0 20px 40px rgba(180,0,0,0.12),0 4px 12px rgba(180,0,0,0.08);padding:30px 35px;border:2px solid #f7c5c5;}
    header{text-align:center;margin-bottom:28px;}
    header h1{font-size:2.6rem;font-weight:700;color:#9b1c1c;text-shadow:2px 2px 0 #fce8e8;}
    header h1 i{color:#e53e3e;margin-right:12px;}
    .subtitle{font-size:1.2rem;font-weight:600;color:#7f1d1d;background:#ffeaea;display:inline-block;padding:8px 24px;border-radius:40px;box-shadow:inset 0 1px 4px rgba(255,255,255,0.8),0 4px 6px rgba(0,0,0,0.05);}
    .main-panel{display:flex;flex-wrap:wrap;gap:28px;}
    .heart-section{flex:2;min-width:360px;background:#fff5f5;border-radius:50px;padding:25px 20px;box-shadow:inset 0 0 0 2px #fcd5d5,0 10px 20px rgba(180,0,0,0.1);display:flex;flex-direction:column;align-items:center;}
    .heart-wrapper{width:100%;display:flex;justify-content:center;margin-bottom:15px;position:relative;}
    .heart-svg-wrap{position:relative;width:260px;height:260px;}
    .heart-svg-wrap svg{width:260px;height:260px;filter:drop-shadow(0 12px 16px rgba(180,0,0,0.22));}
    .heart-pulse{animation:pulse 1.8s ease-in-out infinite;}
    @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
    .coin-slot-label{position:absolute;top:26px;left:50%;transform:translateX(-50%);background:#7f1d1d;color:#fde8e8;font-family:'Quicksand',sans-serif;font-size:13px;font-weight:700;padding:4px 14px;border-radius:30px;white-space:nowrap;z-index:10;letter-spacing:0.5px;}
    .floating-hearts{position:absolute;bottom:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;}
    .fh{position:absolute;font-size:18px;opacity:0;animation:floatUp 2s ease-in forwards;}
    @keyframes floatUp{0%{opacity:0.9;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-160px) scale(0.5);}}
    .stats{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:22px 0 14px;}
    .stat-card{background:#fde8e8;border-radius:40px;padding:12px 22px;box-shadow:inset 0 1px 4px #fff5f5,0 5px 0 #e8a0a0,0 4px 8px rgba(0,0,0,0.05);text-align:center;min-width:125px;}
    .stat-label{display:block;font-size:0.95rem;font-weight:600;color:#7f1d1d;margin-bottom:5px;}
    .stat-value{font-size:1.9rem;font-weight:700;color:#1a4a2e;text-shadow:1px 1px 0 #fde8e8;}
    .progress-bar-container{width:90%;height:28px;background:#f3c6c6;border-radius:40px;box-shadow:inset 0 4px 6px rgba(120,0,0,0.18),0 5px 0 #d48a8a;margin:8px 0 18px;overflow:hidden;}
    .progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#e53e3e,#9b1c1c);border-radius:40px;box-shadow:inset 0 2px 5px #f9a0a0;transition:width 0.5s ease;}
    .days-left{font-size:1.15rem;font-weight:600;background:#fff0f0;padding:8px 25px;border-radius:50px;color:#7f1d1d;box-shadow:inset 0 0 0 2px #f7c5c5;}
    .log-section{flex:1.2;min-width:310px;background:#fff5f5;border-radius:40px;padding:25px 20px;box-shadow:inset 0 0 0 2px #fcd5d5,0 10px 20px rgba(180,0,0,0.1);display:flex;flex-direction:column;}
    .log-section h2{font-size:1.7rem;color:#9b1c1c;margin-bottom:14px;border-bottom:3px dashed #f7a8a8;padding-bottom:10px;}
    .log-container{background:#fff0f0;border-radius:28px;padding:14px;max-height:340px;overflow-y:auto;box-shadow:inset 0 3px 8px rgba(120,0,0,0.1);margin-bottom:22px;}
    .empty-log{text-align:center;color:#c08080;font-style:italic;padding:14px;}
    .log-entry{display:flex;justify-content:space-between;align-items:center;background:white;margin-bottom:8px;padding:10px 12px 10px 16px;border-radius:50px;box-shadow:0 3px 0 #f0b0b0,0 2px 6px rgba(0,0,0,0.05);font-weight:500;gap:6px;}
    .log-entry .person{font-weight:700;color:#7f1d1d;white-space:nowrap;font-size:0.93rem;}
    .log-entry .amount{font-weight:800;color:#1f5c3a;background:#e8f5ee;padding:4px 10px;border-radius:28px;white-space:nowrap;font-size:0.93rem;}
    .log-entry .date{font-size:0.78rem;color:#9a6060;flex:1;text-align:center;}
    .btn-delete{background:none;border:2px solid #f5b8b8;cursor:pointer;color:#c08080;font-size:0.85rem;font-weight:700;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0;font-family:'Quicksand',sans-serif;}
    .btn-delete:hover{color:#fff;background:#e53e3e;border-color:#e53e3e;transform:scale(1.15);}
    .btn-delete:active{transform:scale(0.9);}

    /* Modal */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(60,0,0,0.4);z-index:200;align-items:center;justify-content:center;}
    .modal-overlay.active{display:flex;}
    .modal{background:#fff5f5;border-radius:40px;padding:32px 28px;max-width:360px;width:90%;box-shadow:0 20px 40px rgba(180,0,0,0.25);border:2px solid #f7c5c5;text-align:center;}
    .modal h3{color:#9b1c1c;font-size:1.35rem;margin-bottom:10px;}
    .modal p{color:#7f1d1d;margin-bottom:24px;font-size:0.97rem;line-height:1.5;}
    .modal-actions{display:flex;gap:12px;justify-content:center;}
    .btn-cancel{background:#fde8e8;border:2px solid #f5b8b8;color:#7f1d1d;font-weight:700;font-size:1rem;padding:10px 26px;border-radius:50px;cursor:pointer;font-family:'Quicksand',sans-serif;transition:background 0.15s;}
    .btn-cancel:hover{background:#fcd5d5;}
    .btn-confirm-delete{background:#e53e3e;border:2px solid #f08080;color:white;font-weight:700;font-size:1rem;padding:10px 26px;border-radius:50px;cursor:pointer;font-family:'Quicksand',sans-serif;box-shadow:0 5px 0 #7f1d1d;transition:all 0.1s;}
    .btn-confirm-delete:hover{background:#c53030;transform:translateY(-1px);}
    .btn-confirm-delete:active{transform:translateY(3px);box-shadow:0 2px 0 #7f1d1d;}

    .deposit-form{background:#fde0e0;border-radius:34px;padding:20px;box-shadow:inset 0 0 0 2px #f5b8b8,0 8px 0 #d89090;}
    .deposit-form h3{margin-bottom:18px;color:#7f1d1d;}
    .form-group{margin-bottom:16px;}
    .form-group label{display:block;font-weight:600;margin-bottom:5px;color:#7f1d1d;}
    select,input{width:100%;padding:11px 15px;font-size:1rem;border:2px solid #e8a0a0;border-radius:60px;background:#fffafa;font-family:'Quicksand',sans-serif;font-weight:500;outline:none;transition:border 0.2s;}
    select:focus,input:focus{border-color:#9b1c1c;box-shadow:0 0 0 3px #fcd5d5;}
    .btn-deposit{background:#e53e3e;border:2px solid #f08080;color:white;font-weight:700;font-size:1.15rem;padding:13px 18px;border-radius:60px;width:100%;cursor:pointer;box-shadow:0 6px 0 #7f1d1d,0 2px 8px rgba(0,0,0,0.12);transition:all 0.1s ease;font-family:'Quicksand',sans-serif;}
    .btn-deposit:hover{background:#c53030;transform:translateY(-2px);box-shadow:0 8px 0 #7f1d1d;}
    .btn-deposit:active{transform:translateY(4px);box-shadow:0 4px 0 #7f1d1d;}
    .btn-deposit:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
    .form-message{margin-top:11px;font-weight:600;color:#9b1c1c;min-height:22px;}
    @media(max-width:850px){.container{padding:18px 12px;}header h1{font-size:2rem;}}
  </style>
</head>
<body>

<!-- Modal de confirmación de eliminación -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>🗑️ Eliminar depósito</h3>
    <p id="modalText">¿Seguro que quieres eliminar este depósito?</p>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancel">Cancelar</button>
      <button class="btn-confirm-delete" id="btnConfirmDelete">Sí, eliminar</button>
    </div>
  </div>
</div>

<div class="container">
  <header>
    <h1><i class="fas fa-heart"></i> Nuestra Alcancía del Amor</h1>
    <p class="subtitle">✈️ Jessica &amp; Kleeders · Meta: $1,200 · ¡Nuestro primer viaje juntos!</p>
  </header>

  <div class="main-panel">
    <section class="heart-section">
      <div class="heart-wrapper">
        <div class="heart-svg-wrap">
          <span class="coin-slot-label">💰 Ranura de sueños</span>
          <svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg" class="heart-pulse">
            <defs>
              <clipPath id="heartClip">
                <path d="M130,220 C130,220 20,150 20,90 C20,55 48,30 80,30 C100,30 118,42 130,58 C142,42 160,30 180,30 C212,30 240,55 240,90 C240,150 130,220 130,220 Z"/>
              </clipPath>
              <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#f87171"/>
                <stop offset="100%" stop-color="#b91c1c"/>
              </linearGradient>
              <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#fca5a5"/>
                <stop offset="100%" stop-color="#dc2626"/>
              </linearGradient>
            </defs>
            <path d="M130,220 C130,220 20,150 20,90 C20,55 48,30 80,30 C100,30 118,42 130,58 C142,42 160,30 180,30 C212,30 240,55 240,90 C240,150 130,220 130,220 Z" fill="#d1202033" transform="translate(4,8)"/>
            <path d="M130,220 C130,220 20,150 20,90 C20,55 48,30 80,30 C100,30 118,42 130,58 C142,42 160,30 180,30 C212,30 240,55 240,90 C240,150 130,220 130,220 Z" fill="url(#heartGrad)" stroke="#9b1c1c" stroke-width="3"/>
            <rect id="heartFillRect" x="10" y="0" width="240" height="230" fill="url(#fillGrad)" clip-path="url(#heartClip)" opacity="0.92" style="transform-origin:bottom center;transform:scaleY(0);transition:transform 0.6s cubic-bezier(.22,.97,.33,1.1);"/>
            <ellipse cx="95" cy="72" rx="22" ry="14" fill="white" opacity="0.22"/>
            <text x="130" y="148" text-anchor="middle" font-family="Quicksand,sans-serif" font-size="13" font-weight="700" fill="#fff8f8" opacity="0.95">✈️ Primer Viaje</text>
            <text x="130" y="167" text-anchor="middle" font-family="Quicksand,sans-serif" font-size="11" font-weight="600" fill="#fecaca" opacity="0.85">¡Lo vamos a lograr!</text>
            <rect x="105" y="26" width="50" height="14" rx="7" fill="#7f1d1d" stroke="#9b1c1c" stroke-width="1.5"/>
          </svg>
          <div class="floating-hearts" id="floatingHearts"></div>
        </div>
      </div>

      <div class="stats">
        <div class="stat-card">
          <span class="stat-label">💰 Ahorrado</span>
          <span class="stat-value" id="totalSaved">$0.00</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">🎯 Restante</span>
          <span class="stat-value" id="remaining">$1,200.00</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">💖 Progreso</span>
          <span class="stat-value" id="progressPercent">0%</span>
        </div>
      </div>

      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <p class="days-left" id="daysLeft"></p>
    </section>

    <section class="log-section">
      <h2>❤️ Historial de depósitos</h2>
      <div class="log-container" id="logContainer">
        <p class="empty-log">Cargando... 💑</p>
      </div>

      <div class="deposit-form">
        <h3>💕 Nuevo depósito</h3>
        <div class="form-group">
          <label for="personSelect">¿Quién deposita?</label>
          <select id="personSelect">
            <option value="Jessica">Jessica 👩</option>
            <option value="Kleeders">Kleeders 🧑🏽</option>
            <option value="Ambos">Ambos 💑</option>
          </select>
        </div>
        <div class="form-group">
          <label for="amountInput">Monto ($)</label>
          <input type="number" id="amountInput" min="0.01" step="0.01" placeholder="Ej: 50.00">
        </div>
        <button id="depositBtn" class="btn-deposit">❤️ Depositar</button>
        <p id="formMessage" class="form-message"></p>
      </div>
    </section>
  </div>
</div>

<script>
const GOAL = 1200;
const DEADLINE = new Date('2026-12-31');
const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? 'http://localhost:8000'
  : 'https://alcancia.onrender.com';
let pendingDeleteIndex = null;
let depositsCache = [];

function fmt(n) {
  return '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function updateUI(deposits) {
  depositsCache = deposits;
  const total = deposits.reduce((a, d) => a + parseFloat(d.amount), 0);
  const pct = Math.min(100, (total / GOAL) * 100);
  const rem = Math.max(0, GOAL - total);

  document.getElementById('totalSaved').textContent = fmt(total);
  document.getElementById('remaining').textContent = fmt(rem);
  document.getElementById('progressPercent').textContent = pct.toFixed(1) + '%';
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('heartFillRect').style.transform = 'scaleY(' + (pct / 100) + ')';

  const diff = Math.ceil((DEADLINE - new Date()) / (1000 * 60 * 60 * 24));
  document.getElementById('daysLeft').textContent = diff > 0
    ? '⏳ ' + diff + ' días para nuestro viaje soñado ✈️'
    : '🎉 ¡El viaje ya llegó!';

  const lc = document.getElementById('logContainer');
  if (deposits.length === 0) {
    lc.innerHTML = '<p class="empty-log">Aún no hay depósitos. ¡Juntos lo van a lograr! 💑</p>';
    return;
  }

  // Guardar índice original antes de ordenar
  const indexed = deposits.map((d, i) => ({ ...d, originalIndex: i }));
  const sorted = [...indexed].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

  lc.innerHTML = sorted.map(d => {
    const fecha = new Date(d.timestamp).toLocaleDateString('es-ES');
    const hora = new Date(d.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const icon = d.person === 'Jessica' ? '👩' : (d.person === 'Kleeders' ? '🧑🏽' : '💑');
    return `
      <div class="log-entry">
        <span class="person">${icon} ${d.person}</span>
        <span class="amount">${fmt(parseFloat(d.amount))}</span>
        <span class="date">${fecha} ${hora}</span>
        <button class="btn-delete" title="Eliminar" data-index="${d.originalIndex}">✕</button>
      </div>`;
  }).join('');

  lc.querySelectorAll('.btn-delete').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.index);
      const dep = depositsCache[idx];
      const fecha = new Date(dep.timestamp).toLocaleDateString('es-ES');
      pendingDeleteIndex = idx;
      document.getElementById('modalText').textContent =
        `¿Eliminar el depósito de ${fmt(parseFloat(dep.amount))} de ${dep.person} del ${fecha}?`;
      document.getElementById('modalOverlay').classList.add('active');
    });
  });
}

async function fetchDeposits() {
  try {
    const res = await fetch(`${API_URL}/api/deposits`);
    if (!res.ok) throw new Error();
    updateUI(await res.json());
  } catch {
    document.getElementById('logContainer').innerHTML =
      '<p class="empty-log">No se pudo cargar el historial. ¿Está corriendo el servidor?</p>';
  }
}

async function deleteDeposit(index) {
  try {
    const res = await fetch(`${API_URL}/api/deposits/${index}`, { method: 'DELETE' });
    const result = await res.json();
    if (result.success) await fetchDeposits();
  } catch {
    alert('Error de conexión al eliminar.');
  }
}

// Eventos del modal
document.getElementById('btnCancel').addEventListener('click', () => {
  document.getElementById('modalOverlay').classList.remove('active');
  pendingDeleteIndex = null;
});
document.getElementById('btnConfirmDelete').addEventListener('click', async () => {
  document.getElementById('modalOverlay').classList.remove('active');
  if (pendingDeleteIndex !== null) {
    await deleteDeposit(pendingDeleteIndex);
    pendingDeleteIndex = null;
  }
});
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('active');
    pendingDeleteIndex = null;
  }
});

function spawnHeart() {
  const c = document.getElementById('floatingHearts');
  const h = document.createElement('span');
  h.className = 'fh';
  h.textContent = '❤️';
  h.style.left = Math.random() * 80 + 10 + '%';
  h.style.fontSize = (14 + Math.random() * 12) + 'px';
  h.style.animationDuration = (1.2 + Math.random() * 0.8) + 's';
  c.appendChild(h);
  setTimeout(() => h.remove(), 2200);
}

document.getElementById('depositBtn').addEventListener('click', async () => {
  const person = document.getElementById('personSelect').value;
  const val = parseFloat(document.getElementById('amountInput').value);
  const msg = document.getElementById('formMessage');
  const btn = document.getElementById('depositBtn');

  if (!val || val <= 0) { msg.textContent = '💔 Ingresa un monto válido.'; return; }
  if (val > 100000) { msg.textContent = '😅 Monto demasiado alto, verifica.'; return; }

  btn.disabled = true;
  btn.textContent = '⏳ Guardando...';

  const formData = new FormData();
  formData.append('person', person);
  formData.append('amount', val);

  try {
    const res = await fetch(`${API_URL}/api/deposits`, { method: 'POST', body: formData });
    const result = await res.json();
    if (result.success) {
      msg.style.color = '#1f7a3d';
      msg.textContent = '✅ ¡Depósito guardado con amor! 💕';
      document.getElementById('amountInput').value = '';
      await fetchDeposits();
      for (let i = 0; i < 8; i++) setTimeout(spawnHeart, i * 120);
    } else {
      msg.style.color = '#9b1c1c';
      msg.textContent = '❌ ' + (result.message || 'Error al guardar.');
    }
  } catch {
    msg.style.color = '#9b1c1c';
    msg.textContent = '❌ Error de conexión con el servidor.';
  } finally {
    btn.disabled = false;
    btn.textContent = '❤️ Depositar';
    setTimeout(() => { msg.textContent = ''; msg.style.color = '#9b1c1c'; }, 3500);
  }
});

fetchDeposits();
</script>
</body>
</html>
